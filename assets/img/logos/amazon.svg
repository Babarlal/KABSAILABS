<!--
  [NEEDS INPUT] Placeholder. This is not the Amazon logo.

  /lp/inventory-sync lists Amazon as a sales channel and referenced this file, which did
  not exist. The markup has an onerror that redraws missing logos from cdn.simpleicons.org,
  but that CDN 404s for amazon too, so the slot rendered empty on an ad landing page.

  This file exists so the slot holds its space and the onerror never fires. It draws
  nothing visible on purpose: an obviously wrong mark is worse than a gap on a page we are
  buying traffic to.

  To finish: replace the contents of this file with the real mark, keeping the 24x24
  viewBox so it lines up with the other channel logos. Amazon's trademark guidelines
  govern how it may be shown, so it wants a deliberate choice rather than a file pulled
  off a CDN.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="presentation" aria-hidden="true">
  <rect width="24" height="24" fill="none"/>
</svg>
